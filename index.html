<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1024">
<title>合同な図形 学習ソフト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F8F9FA; --canvas-bg:#FFFFFF; --accent:#2563EB; --correct:#16A34A; --wrong:#DC2626; --hint:#FBBF24;
    --vA:#DC2626; --vB:#2563EB; --vC:#16A34A; --vD:#EA580C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:'Noto Sans JP',sans-serif;color:#1f2937;}
  #app{display:flex;flex-direction:column;min-width:1024px;}
  header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:#fff;border-bottom:2px solid #e5e7eb;}
  header h1{font-size:18px;margin:0;color:var(--accent);}
  .tabs{display:flex;gap:8px;margin-left:auto;}
  .tab-btn{font-size:16px;font-weight:700;padding:8px 18px;border-radius:8px 8px 0 0;border:2px solid #e5e7eb;background:#f1f5f9;cursor:pointer;}
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  main{display:flex;flex:1;}
  #leftPanel{width:240px;flex:0 0 240px;background:#fff;border-right:2px solid #e5e7eb;padding:14px;min-height:680px;}
  #leftPanel h2{font-size:15px;margin:0 0 10px;border-bottom:2px solid var(--accent);padding-bottom:4px;}
  #centerArea{flex:1;display:flex;flex-direction:column;align-items:center;padding:16px;}
  #canvasWrap{position:relative;width:800px;height:600px;background:var(--canvas-bg);border:2px solid #e5e7eb;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
  canvas{position:absolute;top:0;left:0;}
  #bottomPanel{width:800px;margin-top:10px;background:#fff;border:2px solid #e5e7eb;border-radius:8px;padding:12px 16px;min-height:90px;font-size:18px;line-height:1.8;}
  .hidden{display:none !important;}
  button{font-family:inherit;}
  .toolbtn{display:flex;align-items:center;gap:8px;width:100%;padding:10px;margin-bottom:8px;border:2px solid #e5e7eb;border-radius:8px;background:#f8fafc;font-size:15px;font-weight:500;cursor:pointer;text-align:left;}
  .toolbtn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .diffbtn{padding:6px 10px;border-radius:6px;border:2px solid #e5e7eb;background:#f8fafc;font-size:13px;margin-right:4px;margin-bottom:4px;cursor:pointer;}
  .diffbtn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  #scoreBar{font-size:15px;font-weight:700;background:#f1f5f9;border-radius:8px;padding:8px 10px;margin-bottom:12px;text-align:center;}
  #answerRow{display:flex;align-items:center;gap:10px;margin-top:8px;}
  #answerInput{font-size:20px;padding:6px 10px;width:120px;border:2px solid #cbd5e1;border-radius:6px;}
  #submitBtn,#nextBtn,#showSampleBtn,#undoBtn{font-size:15px;font-weight:700;padding:8px 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer;}
  #feedback{font-weight:700;margin-top:6px;}
  #feedback.correct{color:var(--correct);}
  #feedback.wrong{color:var(--wrong);}
  .vlabel{position:absolute;font-weight:700;font-size:16px;pointer-events:none;}
  #methodTabs{display:flex;gap:6px;margin-bottom:10px;}
  .methodbtn{flex:1;padding:6px;font-size:13px;font-weight:700;border-radius:6px;border:2px solid #e5e7eb;background:#f8fafc;cursor:pointer;}
  .methodbtn.active{background:#16A34A;color:#fff;border-color:#16A34A;}
  #stepIndicator{font-weight:700;color:var(--accent);font-size:16px;margin-bottom:4px;}
  #introOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:50;}
  #introOverlay .box{background:#fff;border-radius:12px;padding:28px 32px;max-width:560px;font-size:16px;line-height:1.8;}
  #introOverlay h2{color:var(--accent);}
  #introOverlay button{margin-top:14px;font-size:16px;font-weight:700;padding:10px 20px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer;}
  @media print{
    header,#leftPanel,.tabs,#drawMode,#methodTabs{display:none !important;}
    body{background:#fff;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>合同な図形 学習ソフト</h1>
    <div class="tabs">
      <button class="tab-btn active" id="tabQuiz">演習モード</button>
      <button class="tab-btn" id="tabDraw">作図モード</button>
    </div>
  </header>
  <main>
    <div id="leftPanel">
      <div id="quizLeft">
        <h2>もんだいの しゅるい</h2>
        <p style="font-size:13px;color:#555;">せんせいモード：なんいど</p>
        <div>
          <button class="diffbtn active" data-diff="mix">こんごう</button>
          <button class="diffbtn" data-diff="side">へんのみ</button>
          <button class="diffbtn" data-diff="angle">かくのみ</button>
        </div>
        <div id="scoreBar">0問中0問正解（0%）</div>
        <button class="toolbtn" id="restartBtn">出題をやり直す</button>
      </div>
      <div id="drawLeft" class="hidden">
        <h2>ツール</h2>
        <button class="toolbtn active" data-tool="ruler">📏 じょうぎ</button>
        <button class="toolbtn" data-tool="compass">🧭 コンパス</button>
        <button class="toolbtn" data-tool="protractor">📐 ぶんどき</button>
        <button class="toolbtn" data-tool="eraser">🧹 けしごむ</button>
        <h2 style="margin-top:14px;">さくずほうほう</h2>
        <div id="methodTabs">
          <button class="methodbtn active" data-method="A">A 三辺</button>
          <button class="methodbtn" data-method="B">B 二辺夾角</button>
          <button class="methodbtn" data-method="C">C 一辺両角</button>
        </div>
        <button class="toolbtn" id="showSampleBtn">👀 答えを見る</button>
        <button class="toolbtn" id="undoBtn">↩ もとに戻す(Ctrl+Z)</button>
        <button class="toolbtn" id="drawRestartBtn">🔄 この問題をやり直す</button>
      </div>
    </div>
    <div id="centerArea">
      <div id="canvasWrap">
        <canvas id="mainCanvas" width="800" height="600"></canvas>
      </div>
      <div id="bottomPanel">
        <div id="quizBottom">
          <div id="questionText" style="font-weight:700;font-size:18px;"></div>
          <div id="answerRow">
            <input type="number" id="answerInput" step="0.1" placeholder="数値">
            <span id="unitLabel"></span>
            <button id="submitBtn">こたえる</button>
            <button id="nextBtn" class="hidden">つぎの問題へ</button>
          </div>
          <div id="feedback"></div>
        </div>
        <div id="drawBottom" class="hidden">
          <div id="stepIndicator"></div>
          <div id="stepText"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="introOverlay">
  <div class="box">
    <h2>合同<ruby>合同<rt>ごうどう</rt></ruby>な図形 学習ソフトへ ようこそ！</h2>
    <p>① 「演習モード」では、合同な図形の対応する辺や角の大きさをこたえます。</p>
    <p>② 「作図モード」では、コンパスや定規・分度器を使って合同な三角形をかく練習をします。</p>
    <p>上のタブでモードをえらんで、はじめましょう！</p>
    <button id="introCloseBtn">はじめる</button>
  </div>
</div>

<script>
/* =========================================================
   ここに先生が問題を追加してください（QUIZ_PROBLEMS, DRAW_PROBLEMS）
   ========================================================= */
const QUIZ_PROBLEMS = {
  triangle_acute: [
    {pts:[[0,0],[6,0],[2,4.5]], labels:['A','B','C']},
    {pts:[[0,0],[5,0],[2.5,4]], labels:['A','B','C']},
    {pts:[[0,0],[7,0],[3,3.5]], labels:['A','B','C']},
    {pts:[[0,0],[6,0],[3,5]], labels:['A','B','C']},
  ],
  triangle_obtuse: [
    {pts:[[0,0],[6,0],[7.5,2]], labels:['A','B','C']},
    {pts:[[0,0],[5,0],[6.5,1.5]], labels:['A','B','C']},
    {pts:[[0,0],[7,0],[8,1.8]], labels:['A','B','C']},
    {pts:[[0,0],[6,0],[7,1.2]], labels:['A','B','C']},
  ],
  triangle_right: [
    {pts:[[0,0],[6,0],[0,4]], labels:['A','B','C']},
    {pts:[[0,0],[5,0],[0,5]], labels:['A','B','C']},
    {pts:[[0,0],[7,0],[0,3]], labels:['A','B','C']},
    {pts:[[0,0],[4,0],[0,6]], labels:['A','B','C']},
  ],
  quad_parallelogram: [
    {pts:[[0,0],[6,0],[8,4],[2,4]], labels:['A','B','C','D']},
    {pts:[[0,0],[5,0],[7,3],[2,3]], labels:['A','B','C','D']},
    {pts:[[0,0],[7,0],[9,3.5],[2,3.5]], labels:['A','B','C','D']},
    {pts:[[0,0],[6,0],[7.5,4.5],[1.5,4.5]], labels:['A','B','C','D']},
  ],
  quad_trapezoid: [
    {pts:[[0,0],[8,0],[6,4],[2,4]], labels:['A','B','C','D']},
    {pts:[[0,0],[7,0],[5,3.5],[1.5,3.5]], labels:['A','B','C','D']},
    {pts:[[0,0],[9,0],[6.5,4],[2,4]], labels:['A','B','C','D']},
    {pts:[[0,0],[8,0],[5.5,3],[2.5,3]], labels:['A','B','C','D']},
  ],
  quad_general: [
    {pts:[[0,0],[6,0],[7,4],[1,5]], labels:['A','B','C','D']},
    {pts:[[0,0],[5,0],[6.5,3.5],[0.5,4.5]], labels:['A','B','C','D']},
    {pts:[[0,0],[7,0.5],[6,4.5],[1.5,4]], labels:['A','B','C','D']},
    {pts:[[0,0],[6,1],[5,5],[0.5,3.5]], labels:['A','B','C','D']},
  ],
};

const DRAW_PROBLEMS = {
  A: [
    {AB:5,AC:4,BC:3},
    {AB:6,AC:5,BC:4},
    {AB:7,AC:6,BC:5},
    {AB:5,AC:6,BC:7},
    {AB:6,AC:4,BC:5},
  ],
  B: [
    {AB:5,AC:4,angleA:60},
    {AB:6,AC:5,angleA:45},
    {AB:5,AC:5,angleA:70},
    {AB:7,AC:4,angleA:50},
    {AB:6,AC:6,angleA:80},
  ],
  C: [
    {AB:6,angleA:50,angleB:60},
    {AB:5,angleA:70,angleB:40},
    {AB:7,angleA:45,angleB:55},
    {AB:6,angleA:80,angleB:35},
    {AB:5,angleA:60,angleB:60},
  ],
};
/* ========================================================= */

const state = {
  mode: 'quiz',
  difficulty: 'mix',
  quiz: { queue: [], idx: 0, current: null, score:{correct:0,total:0}, weak:{} },
  draw: {
    tool: 'ruler', method: 'A', problemIdx: 0,
    step: 1, drawnArcs: [], drawnLines: [], history: [],
    compassCenter: null, compassRadius: null, rulerStart: null,
    protractorBase: null, showSample: false,
  },
};

const SCALE = 40; // 1cm = 40px
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

function toPx(cmPt, ox, oy){ return { x: ox + cmPt[0]*SCALE, y: oy - cmPt[1]*SCALE }; }

/* ---------------- TAB SWITCH ---------------- */
document.getElementById('tabQuiz').onclick = () => switchMode('quiz');
document.getElementById('tabDraw').onclick = () => switchMode('draw');
function switchMode(m){
  state.mode = m;
  document.getElementById('tabQuiz').classList.toggle('active', m==='quiz');
  document.getElementById('tabDraw').classList.toggle('active', m==='draw');
  document.getElementById('quizLeft').classList.toggle('hidden', m!=='quiz');
  document.getElementById('drawLeft').classList.toggle('hidden', m!=='draw');
  document.getElementById('quizBottom').classList.toggle('hidden', m!=='quiz');
  document.getElementById('drawBottom').classList.toggle('hidden', m!=='draw');
  if(m==='quiz') renderQuiz(); else renderDraw();
}

document.getElementById('introCloseBtn').onclick = () => {
  document.getElementById('introOverlay').style.display = 'none';
};

/* ===================== QUIZ MODE ===================== */
document.querySelectorAll('.diffbtn').forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll('.diffbtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    state.difficulty = b.dataset.diff;
    buildQuizQueue();
  };
});
document.getElementById('restartBtn').onclick = () => { buildQuizQueue(); };

function dist(p1,p2){ return Math.hypot(p1[0]-p2[0], p1[1]-p2[1]); }
function angleAt(pts,i){
  const n = pts.length;
  const p = pts[i], a = pts[(i-1+n)%n], b = pts[(i+1)%n];
  const v1 = [a[0]-p[0], a[1]-p[1]], v2 = [b[0]-p[0], b[1]-p[1]];
  const dot = v1[0]*v2[0]+v1[1]*v2[1];
  const mag = Math.hypot(...v1)*Math.hypot(...v2);
  return Math.acos(Math.max(-1,Math.min(1,dot/mag))) * 180/Math.PI;
}

function buildQuizQueue(){
  const keys = Object.keys(QUIZ_PROBLEMS);
  let list = [];
  keys.forEach(k => {
    QUIZ_PROBLEMS[k].forEach((p) => list.push({shape:k, data:p}));
  });
  for(let i=list.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; }
  state.quiz.queue = list;
  state.quiz.idx = 0;
  state.quiz.score = {correct:0,total:0};
  state.quiz.weak = {};
  nextQuizProblem();
}

function nextQuizProblem(){
  if(state.quiz.idx >= state.quiz.queue.length){ showResultSummary(); return; }
  const item = state.quiz.queue[state.quiz.idx];
  const pts = item.data.pts;
  const labels = item.data.labels;
  const n = pts.length;
  let qType = state.difficulty;
  if(qType === 'mix') qType = Math.random() < 0.5 ? 'side' : 'angle';
  const targetIdx = Math.floor(Math.random()*n);

  const angle = Math.random()*Math.PI*2;
  const reflect = Math.random() < 0.5;
  const cos = Math.cos(angle), sin = Math.sin(angle);
  function transform(p){
    let x = p[0], y = p[1];
    if(reflect) x = -x;
    return [x*cos - y*sin, x*sin + y*cos];
  }
  const pts2raw = pts.map(transform);
  state.quiz.current = {
    shape: item.shape, pts1: pts, pts2: pts2raw, labels, qType, targetIdx, attempts:0,
  };
  document.getElementById('answerInput').value = '';
  document.getElementById('answerInput').disabled = false;
  document.getElementById('submitBtn').classList.remove('hidden');
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = '';
  renderQuiz();
}

function correctAnswerValue(cur){
  const {pts1, qType, targetIdx} = cur;
  const n = pts1.length;
  if(qType === 'side') return dist(pts1[targetIdx], pts1[(targetIdx+1)%n]);
  return angleAt(pts1, targetIdx);
}

function renderQuiz(){
  ctx.clearRect(0,0,800,600);
  document.querySelectorAll('.vlabel').forEach(e=>e.remove());
  updateScoreBar();
  const cur = state.quiz.current;
  if(!cur){ return; }
  const labels = cur.labels;
  const n = labels.length;

  function bbox(pts){
    const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
    return {minx:Math.min(...xs), maxx:Math.max(...xs), miny:Math.min(...ys), maxy:Math.max(...ys)};
  }
  const b1 = bbox(cur.pts1), b2 = bbox(cur.pts2);
  const baseY = 420;
  const origin1 = { x: 80 - b1.minx*SCALE, y: baseY };
  const origin2 = { x: 480 - b2.minx*SCALE, y: baseY };

  function drawShape(pts, origin){
    ctx.beginPath();
    pts.forEach((p,i) => {
      const px = toPx(p, origin.x, origin.y);
      if(i===0) ctx.moveTo(px.x, px.y); else ctx.lineTo(px.x, px.y);
    });
    ctx.closePath();
    ctx.strokeStyle = '#1f2937';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  drawShape(cur.pts1, origin1);
  drawShape(cur.pts2, origin2);

  const vColorsRaw = ['#DC2626','#2563EB','#16A34A','#EA580C'];
  const vShapes = ['●','■','▲','♦'];

  function placeLabels(pts, origin){
    pts.forEach((p,i) => {
      const px = toPx(p, origin.x, origin.y);
      const div = document.createElement('div');
      div.className = 'vlabel';
      div.style.left = (px.x - 8) + 'px';
      div.style.top = (px.y - 24) + 'px';
      div.style.color = vColorsRaw[i];
      div.textContent = vShapes[i] + labels[i];
      document.getElementById('canvasWrap').appendChild(div);
    });
  }
  placeLabels(cur.pts1, origin1);
  placeLabels(cur.pts2, origin2);

  const n2 = cur.pts2.length;
  if(cur.qType === 'side'){
    const i = cur.targetIdx, j=(i+1)%n2;
    const p1 = toPx(cur.pts2[i], origin2.x, origin2.y);
    const p2 = toPx(cur.pts2[j], origin2.x, origin2.y);
    const mx = (p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
    ctx.fillStyle = '#DC2626';
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText('？', mx-6, my-6);
    document.getElementById('questionText').textContent = `${labels[i]}${labels[j]} の長さは何cm？（対応する図形のもう一方を見て考えよう）`;
    document.getElementById('unitLabel').textContent = 'cm';
  } else {
    const i = cur.targetIdx;
    const p = toPx(cur.pts2[i], origin2.x, origin2.y);
    ctx.fillStyle = '#DC2626';
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText('？', p.x-6, p.y-14);
    document.getElementById('questionText').textContent = `角${labels[i]} の大きさは何度？（対応する図形のもう一方を見て考えよう）`;
    document.getElementById('unitLabel').textContent = '°';
  }

  if(cur.attempts >= 1){
    const idx = cur.targetIdx;
    const idx2 = cur.qType==='side' ? (cur.targetIdx+1)%n : null;
    [idx, idx2].forEach(ix => {
      if(ix===null || ix===undefined) return;
      const p = toPx(cur.pts1[ix], origin1.x, origin1.y);
      ctx.save();
      ctx.beginPath();
      ctx.arc(p.x, p.y, 10, 0, Math.PI*2);
      ctx.strokeStyle = '#FBBF24';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    });
  }
  if(cur.attempts >= 2){
    if(cur.qType === 'side'){
      const i=cur.targetIdx, j=(i+1)%n;
      const p1 = toPx(cur.pts1[i], origin1.x, origin1.y);
      const p2 = toPx(cur.pts1[j], origin1.x, origin1.y);
      ctx.save();
      ctx.strokeStyle = '#FBBF24'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
      ctx.restore();
    } else {
      const p = toPx(cur.pts1[cur.targetIdx], origin1.x, origin1.y);
      ctx.save();
      ctx.beginPath();
      ctx.arc(p.x, p.y, 18, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(251,191,36,0.3)';
      ctx.fill();
      ctx.restore();
    }
  }
}

document.getElementById('submitBtn').onclick = () => {
  const cur = state.quiz.current;
  if(!cur) return;
  const val = parseFloat(document.getElementById('answerInput').value);
  if(isNaN(val)){ return; }
  const correct = correctAnswerValue(cur);
  const ok = Math.abs(val - correct) < 0.3;
  const fb = document.getElementById('feedback');
  if(ok){
    state.quiz.score.correct++; state.quiz.score.total++;
    fb.textContent = '✅ 正解！対応する辺（角）の大きさは等しいね✨';
    fb.className = 'correct';
    document.getElementById('submitBtn').classList.add('hidden');
    document.getElementById('nextBtn').classList.remove('hidden');
    document.getElementById('answerInput').disabled = true;
  } else {
    cur.attempts++;
    if(cur.attempts === 1){
      fb.textContent = '❌ もう一度考えてみよう。対応する頂点はどれとどれかな？';
    } else if(cur.attempts === 2){
      fb.textContent = '❌ ヒント：対応する辺（角）を見つけよう。（黄色い印を見てね）';
    } else {
      state.quiz.score.total++;
      const shapeName = cur.shape;
      state.quiz.weak[shapeName] = (state.quiz.weak[shapeName]||0)+1;
      fb.textContent = `答えは ${correct.toFixed(1)}${cur.qType==='side'?'cm':'°'} だよ。合同な図形では対応する辺の長さ・角の大きさはすべて等しくなります。`;
      document.getElementById('submitBtn').classList.add('hidden');
      document.getElementById('nextBtn').classList.remove('hidden');
      document.getElementById('answerInput').disabled = true;
    }
    fb.className = 'wrong';
  }
  renderQuiz();
};

document.getElementById('nextBtn').onclick = () => {
  state.quiz.idx++;
  nextQuizProblem();
};

function updateScoreBar(){
  const {correct, total} = state.quiz.score;
  const pct = total>0 ? Math.round(correct/total*100) : 0;
  document.getElementById('scoreBar').textContent = `${total}問中${correct}問正解（${pct}%）`;
}

function showResultSummary(){
  const {correct,total} = state.quiz.score;
  const pct = total>0?Math.round(correct/total*100):0;
  let weakText = Object.keys(state.quiz.weak).length
    ? Object.entries(state.quiz.weak).map(([k,v])=>`${shapeLabelJP(k)}（${v}回）`).join('、')
    : 'なし';
  const ov = document.createElement('div');
  ov.id = 'resultOverlay';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:60;';
  ov.innerHTML = `<div style="background:#fff;border-radius:12px;padding:28px 36px;text-align:center;font-size:16px;line-height:1.8;">
    <h2 style="color:#2563EB;margin-top:0;">けっか発表！</h2>
    <p>${total}問中 ${correct}問正解（正答率 ${pct}%）</p>
    <p>苦手だった図形：${weakText}</p>
    <button id="resultCloseBtn" style="font-size:16px;font-weight:700;padding:10px 20px;border-radius:8px;border:none;background:#2563EB;color:#fff;cursor:pointer;">もう一度</button>
  </div>`;
  document.body.appendChild(ov);
  document.getElementById('resultCloseBtn').onclick = () => {
    ov.remove();
    buildQuizQueue();
  };
}

function shapeLabelJP(k){
  return {
    triangle_acute:'鋭角三角形', triangle_obtuse:'鈍角三角形', triangle_right:'直角三角形',
    quad_parallelogram:'平行四辺形', quad_trapezoid:'台形', quad_general:'一般四角形',
  }[k] || k;
}

/* ===================== DRAW MODE ===================== */
document.querySelectorAll('[data-tool]').forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    state.draw.tool = b.dataset.tool;
    state.draw.compassCenter = null; state.draw.rulerStart=null; state.draw.protractorBase=null;
  };
});
document.querySelectorAll('.methodbtn').forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll('.methodbtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    state.draw.method = b.dataset.method;
    resetDrawProblem();
  };
});
document.getElementById('drawRestartBtn').onclick = resetDrawProblem;
document.getElementById('showSampleBtn').onclick = () => {
  state.draw.showSample = !state.draw.showSample;
  renderDraw();
};
document.getElementById('undoBtn').onclick = undoDraw;
document.addEventListener('keydown', (e) => {
  if((e.ctrlKey||e.metaKey) && e.key === 'z'){ e.preventDefault(); undoDraw(); }
});
function undoDraw(){
  const h = state.draw.history;
  if(h.length===0) return;
  const last = h.pop();
  if(last.type==='line') state.draw.drawnLines.pop();
  if(last.type==='arc') state.draw.drawnArcs.pop();
  state.draw.step = Math.max(1, state.draw.step-1);
  renderDraw();
}

function resetDrawProblem(){
  state.draw.step = 1;
  state.draw.drawnArcs = [];
  state.draw.drawnLines = [];
  state.draw.history = [];
  state.draw.compassCenter = null;
  state.draw.compassRadius = null;
  state.draw.rulerStart = null;
  state.draw.protractorBase = null;
  state.draw.showSample = false;
  renderDraw();
}

function currentDrawProblem(){
  const list = DRAW_PROBLEMS[state.draw.method];
  return list[state.draw.problemIdx % list.length];
}

const DRAW_ORIGIN = { x: 150, y: 480 };

function stepDefs(method, prob){
  if(method === 'A'){
    return [
      { text: `ステップ1：定規をつかって、底辺ABを${prob.AB}cmでひこう` },
      { text: `ステップ2：コンパスをつかって、頂点Aから AC（${prob.AC}cm）の長さをとり、弧をかこう` },
      { text: `ステップ3：コンパスをつかって、頂点Bから BC（${prob.BC}cm）の長さをとり、弧をかこう` },
      { text: `ステップ4：2つの弧の交点が頂点C。AC・BCを結んで完成させよう` },
    ];
  }
  if(method === 'B'){
    return [
      { text: `ステップ1：定規をつかって、底辺ABを${prob.AB}cmでひこう` },
      { text: `ステップ2：分度器をつかって、頂点Aに角${prob.angleA}°をとり、補助線をひこう` },
      { text: `ステップ3：コンパスをつかって、その方向にAC（${prob.AC}cm）の長さをとり、頂点Cを決めよう` },
      { text: `ステップ4：BCを結んで完成させよう` },
    ];
  }
  return [
    { text: `ステップ1：定規をつかって、底辺ABを${prob.AB}cmでひこう` },
    { text: `ステップ2：分度器をつかって、頂点Aに角${prob.angleA}°をとり、補助線をひこう` },
    { text: `ステップ3：分度器をつかって、頂点Bに角${prob.angleB}°をとり、補助線をひこう` },
    { text: `ステップ4：2本の補助線の交点が頂点C。結んで完成させよう` },
  ];
}

function renderDraw(){
  ctx.clearRect(0,0,800,600);
  document.querySelectorAll('.vlabel').forEach(e=>e.remove());
  const prob = currentDrawProblem();
  const steps = stepDefs(state.draw.method, prob);
  const step = Math.min(state.draw.step, steps.length);
  document.getElementById('stepIndicator').textContent = `ステップ ${step} / ${steps.length}`;
  document.getElementById('stepText').textContent = steps[step-1].text;

  ctx.fillStyle = '#1f2937';
  ctx.font = '14px sans-serif';
  let cardText = '';
  if(state.draw.method==='A') cardText = `三角形ABCをかこう：AB=${prob.AB}cm, AC=${prob.AC}cm, BC=${prob.BC}cm`;
  if(state.draw.method==='B') cardText = `三角形ABCをかこう：AB=${prob.AB}cm, AC=${prob.AC}cm, 角A=${prob.angleA}°`;
  if(state.draw.method==='C') cardText = `三角形ABCをかこう：AB=${prob.AB}cm, 角A=${prob.angleA}°, 角B=${prob.angleB}°`;
  ctx.fillText(cardText, 20, 24);

  const A = { x: DRAW_ORIGIN.x, y: DRAW_ORIGIN.y };
  const B = { x: DRAW_ORIGIN.x + prob.AB*SCALE, y: DRAW_ORIGIN.y };

  state.draw.drawnLines.forEach(l => {
    ctx.beginPath();
    ctx.moveTo(l.x1,l.y1); ctx.lineTo(l.x2,l.y2);
    ctx.strokeStyle = l.color || '#1E3A5F';
    ctx.lineWidth = 2;
    ctx.stroke();
  });
  state.draw.drawnArcs.forEach(a => {
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.r, 0, Math.PI*2);
    ctx.strokeStyle = '#1E3A5F';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  if(state.draw.showSample){
    drawSampleOverlay(prob, A, B);
  }

  if(state.draw.drawnLines.length >= 1 || step>1){
    placeVertexLabel('A', A.x, A.y, '#DC2626');
    placeVertexLabel('B', B.x, B.y, '#2563EB');
  }
  const Cpos = computeVertexC(prob, A, B, state.draw.method);
  if(Cpos && state.draw.step > steps.length){
    placeVertexLabel('C', Cpos.x, Cpos.y, '#16A34A');
  }
}

function placeVertexLabel(text, x, y, color){
  const div = document.createElement('div');
  div.className = 'vlabel';
  div.style.left = (x - 8) + 'px';
  div.style.top = (y - 26) + 'px';
  div.style.color = color;
  div.textContent = text;
  document.getElementById('canvasWrap').appendChild(div);
}

function circleIntersection(x1, y1, r1, x2, y2, r2) {
  const d = Math.hypot(x2 - x1, y2 - y1);
  if (d > r1 + r2 || d < Math.abs(r1 - r2) || d===0) return null;
  const a = (r1**2 - r2**2 + d**2) / (2 * d);
  const h = Math.sqrt(Math.max(0, r1**2 - a**2));
  const mx = x1 + a * (x2 - x1) / d;
  const my = y1 + a * (y2 - y1) / d;
  return [
    { x: mx + h * (y2 - y1) / d, y: my - h * (x2 - x1) / d },
    { x: mx - h * (y2 - y1) / d, y: my + h * (x2 - x1) / d }
  ];
}

function computeVertexC(prob, A, B, method){
  if(method==='A'){
    const sols = circleIntersection(A.x,A.y,prob.AC*SCALE, B.x,B.y,prob.BC*SCALE);
    if(!sols) return null;
    return sols.find(s=>s.y < A.y) || sols[0];
  }
  if(method==='B'){
    const rad = -prob.angleA*Math.PI/180;
    return { x: A.x + prob.AC*SCALE*Math.cos(rad), y: A.y + prob.AC*SCALE*Math.sin(rad) };
  }
  const radA = -prob.angleA*Math.PI/180;
  const dirA = { x: Math.cos(radA), y: Math.sin(radA) };
  const dirBrad = Math.PI - prob.angleB*Math.PI/180;
  const dirB = { x: Math.cos(-dirBrad), y: Math.sin(-dirBrad) };
  const det = dirA.x*(-dirB.y) - dirA.y*(-dirB.x);
  if(Math.abs(det) < 1e-6) return null;
  const dx = B.x-A.x, dy=B.y-A.y;
  const t = (dx*(-dirB.y) - dy*(-dirB.x))/det;
  return { x: A.x + t*dirA.x, y: A.y + t*dirA.y };
}

function drawSampleOverlay(prob, A, B){
  const Cpos = computeVertexC(prob, A, B, state.draw.method);
  ctx.save();
  ctx.strokeStyle = 'rgba(37,99,235,0.35)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
  if(Cpos){
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(Cpos.x,Cpos.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(B.x,B.y); ctx.lineTo(Cpos.x,Cpos.y); ctx.stroke();
  }
  ctx.restore();
}

let dragStart = null;
canvas.addEventListener('mousedown', (e) => {
  if(state.mode !== 'draw') return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const prob = currentDrawProblem();
  const A = { x: DRAW_ORIGIN.x, y: DRAW_ORIGIN.y };
  const B = { x: DRAW_ORIGIN.x + prob.AB*SCALE, y: DRAW_ORIGIN.y };

  if(state.draw.tool === 'ruler'){
    if(!state.draw.rulerStart){
      state.draw.rulerStart = {x,y};
    } else {
      const l = {x1:state.draw.rulerStart.x, y1:state.draw.rulerStart.y, x2:x, y2:y};
      state.draw.drawnLines.push(l);
      state.draw.history.push({type:'line'});
      state.draw.rulerStart = null;
      checkStepCompletion(prob);
      renderDraw();
    }
  } else if(state.draw.tool === 'compass'){
    if(!state.draw.compassCenter){
      state.draw.compassCenter = {x,y};
    } else if(state.draw.compassRadius == null){
      state.draw.compassRadius = Math.hypot(x-state.draw.compassCenter.x, y-state.draw.compassCenter.y);
    } else {
      state.draw.drawnArcs.push({x:state.draw.compassCenter.x, y:state.draw.compassCenter.y, r:state.draw.compassRadius});
      state.draw.history.push({type:'arc'});
      state.draw.compassCenter = null;
      state.draw.compassRadius = null;
      checkStepCompletion(prob);
      renderDraw();
    }
  } else if(state.draw.tool === 'protractor'){
    if(!state.draw.protractorBase){
      state.draw.protractorBase = {x,y};
    } else {
      const l = {x1:state.draw.protractorBase.x, y1:state.draw.protractorBase.y, x2:x, y2:y, color:'#7c3aed'};
      state.draw.drawnLines.push(l);
      state.draw.history.push({type:'line'});
      state.draw.protractorBase = null;
      checkStepCompletion(prob);
      renderDraw();
    }
  } else if(state.draw.tool === 'eraser'){
    state.draw.drawnLines = [];
    state.draw.drawnArcs = [];
    renderDraw();
  }
});

function checkStepCompletion(prob){
  const steps = stepDefs(state.draw.method, prob).length;
  if(state.draw.step < steps + 1) state.draw.step++;
}

/* ===================== INIT ===================== */
buildQuizQueue();
renderQuiz();
</script>
</body>
